syntax = "proto3";

package massa.model.v1;

import "google/protobuf/wrappers.proto";
import "massa/model/v1/time.proto";

option csharp_namespace = "Com.Massa.Model.v1";
option go_package = "github.com/massalabs/massa/model/v1;v1";
option java_multiple_files = true;
option java_package = "com.massa.model.v1";
option objc_class_prefix = "MMODEL";
option php_namespace = "Com\\Massa\\Model\\V1";
option ruby_package = "Com::Massa::Model::V1";
option swift_prefix = "MMODEL";

// Information about a cycle snapshot
message CycleSnapshotInfo {
  // The cycle number
  uint64 cycle = 1;
  // Timestamp when the cycle started
  massa.model.v1.NativeTime start_ts = 2;
  // Timestamp when the cycle ends
  massa.model.v1.NativeTime end_ts = 3;
  // Authenticated snapshot Merkle root for this cycle (absent if not committed)
  google.protobuf.BytesValue merkle_root = 4;
  // Signatures over `merkle_root` published for this cycle
  repeated SnapshotRootSignature root_signatures = 5;
}

/// Ed25519 signature over a cycle snapshot Merkle root by an authorized signatory.
message SnapshotRootSignature {
  // Merkle root that was signed
  bytes merkle_root = 1;
  // Public key of the signatory
  string public_key = 2;
  // Ed25519 signature bytes
  bytes signature = 3;
}
